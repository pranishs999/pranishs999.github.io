<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Pranish Shrestha</title>
  <meta name="description" content="The requested endpoint does not exist." />
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-heading: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --color-accent: #22c55e;
      --color-accent-hover: #16a34a;
      
      --color-bg: var(--bg);
      --color-surface: var(--surface);
      --color-panel: var(--panel);
      --color-text-primary: var(--text-primary);
      --color-text-muted: var(--text-muted);
      --color-border: var(--border);
      
      @keyframes glitch {
        0% { transform: translate(0); text-shadow: -2px 2px #16a34a; }
        25% { transform: translate(-2px, 2px); text-shadow: 2px -2px #22c55e; }
        50% { transform: translate(2px, -2px); text-shadow: -2px -2px #16a34a; }
        75% { transform: translate(-2px, -2px); text-shadow: 2px 2px #22c55e; }
        100% { transform: translate(0); text-shadow: -2px 2px #16a34a; }
      }
    }
    
    @utility animate-glitch {
      animation: glitch 0.3s infinite ease-in-out;
    }

    :root {
      /* LIGHT MODE - NEUTRAL ZINC */
      --bg: #ffffff;
      --surface: #fafafa;
      --panel: #f4f4f5;
      --text-primary: #09090b;
      --text-muted: #71717a;
      --border: #e4e4e7;
    }
    
    .dark {
      /* DARK MODE - DEEP ZINC */
      --bg: #09090b;
      --surface: #18181b;
      --panel: #27272a;
      --text-primary: #fafafa;
      --text-muted: #a1a1aa;
      --border: #27272a;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-heading);
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }
    
    p {
      color: var(--text-muted);
      line-height: 1.6;
    }

    .grid-bg {
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    body { 
      transition: background-color 0.2s ease, color 0.2s ease; 
    }
    
    ::-webkit-scrollbar { 
      width: 6px; 
    }
    ::-webkit-scrollbar-track { 
      background: var(--bg); 
    }
    ::-webkit-scrollbar-thumb { 
      background: var(--border); 
      border-radius: 10px; 
    }
  </style>
</head>
<body class="bg-bg text-text-primary font-sans selection:bg-accent/30 min-h-screen flex flex-col items-center justify-center relative overflow-hidden grid-bg">

  <div class="absolute top-8 right-8 z-50">
    <button id="theme-toggle" class="p-2.5 rounded-lg border border-border bg-surface hover:bg-panel text-text-muted hover:text-accent transition-all shadow-sm" aria-label="Toggle theme">
      <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
      </svg>
      <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707-.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
      </svg>
    </button>
  </div>

  <div class="absolute w-[500px] h-[500px] bg-accent/5 blur-[120px] rounded-full top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-0"></div>

  <div class="relative z-10 flex flex-col items-center justify-center text-center px-6 max-w-lg w-full">
    <div class="mb-6">
      <h1 class="text-[9rem] md:text-[11rem] font-mono font-black text-accent leading-none tracking-tighter hover:animate-glitch cursor-default transition-all duration-300">404</h1>
    </div>

    <div class="bg-surface/80 backdrop-blur-xl border border-border p-8 rounded-3xl shadow-2xl w-full max-w-md">
      <h2 class="text-2xl md:text-3xl font-extrabold mb-4 tracking-tight">Endpoint <span class="text-accent">Null</span></h2>
      <p class="text-text-muted mb-8 text-sm md:text-base leading-relaxed">
        The request was rejected by the server. This node does not exist in our production architecture.
      </p>

      <a href="index.html" class="inline-flex items-center gap-3 px-8 py-3.5 rounded-xl bg-accent hover:bg-accent-hover text-white font-bold text-sm transition-all duration-300 shadow-[0_8px_30px_rgba(34,197,94,0.2)] hover:scale-[1.02] active:scale-[0.98]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>Return to Base</span>
      </a>
    </div>
  </div>

  <footer class="absolute bottom-10 w-full text-center px-6">
    <p class="text-text-muted text-[10px] font-mono uppercase tracking-[0.3em]">
      System Status: <span class="text-accent">Live</span> &nbsp;·&nbsp; Build: 2026.04.v4
    </p>
  </footer>

  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    const darkIcon = document.getElementById('theme-toggle-dark-icon');
    const lightIcon = document.getElementById('theme-toggle-light-icon');

    // Initialize the icon matching local storage
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
      lightIcon.classList.remove('hidden');
    } else {
      document.documentElement.classList.remove('dark');
      darkIcon.classList.remove('hidden');
    }

    themeToggleBtn.addEventListener('click', () => {
      darkIcon.classList.toggle('hidden');
      lightIcon.classList.toggle('hidden');

      if (localStorage.getItem('color-theme')) {
        if (localStorage.getItem('color-theme') === 'light') {
          document.documentElement.classList.add('dark');
          localStorage.setItem('color-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('color-theme', 'light');
        }
      } else {
        if (document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('color-theme', 'light');
        } else {
          document.documentElement.classList.add('dark');
          localStorage.setItem('color-theme', 'dark');
        }
      }
    });
  </script>
</body>
</html>
